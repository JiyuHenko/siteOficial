name: Temporary Cleanup Audit

on:
  push:
    branches:
      - chore/drastic-cleanup-2026-09-14

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Audit unused and duplicate assets
        run: node scripts/cleanup-audit.mjs
