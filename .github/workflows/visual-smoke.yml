name: Visual smoke
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Playwright test runner
        run: npm install --no-save @playwright/test@1.58.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start static site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/custommind-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Browser smoke and screenshots
        run: npx playwright test tests/visual-smoke.spec.mjs --reporter=line --workers=2
      - name: Attach layout captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: custommind-v4-screenshots
          path: test-results/*.png
          if-no-files-found: ignore
