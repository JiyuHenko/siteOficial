name: One-shot drastic cleanup

on:
  push:
    branches:
      - chore/drastic-cleanup-2026-09-14

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow

      - name: Remove legacy files and optimize assets
        run: python scripts/apply-cleanup.py

      - name: Synchronize shared static header/footer
        run: node scripts/sync-site-chrome.mjs

      - name: JavaScript syntax
        run: node --check assets/js/custommind-site-v3.js

      - name: Site harness
        run: node .harness/harness.mjs check

      - name: SEO surfaces
        run: node .harness/sync-seo.mjs --check

      - name: Commit staged cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Chore: limpa legado e otimiza assets"
          git push
